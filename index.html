// ─────────────────────────── DB ────────────────────────────
const DB = {
  prefix: 'inv_',
  get(key) { try { return JSON.parse(localStorage.getItem(this.prefix + key)) || []; } catch { return []; } },
  set(key, val) { localStorage.setItem(this.prefix + key, JSON.stringify(val)); },
  nextId(arr) { return arr.length ? Math.max(...arr.map(x => x.id)) + 1 : 1; },

  // branches
  getBranches() { return this.get('branches'); },
  setBranches(v) { this.set('branches', v); },

  // form_types
  getFormTypes() { return this.get('form_types'); },
  setFormTypes(v) { this.set('form_types', v); },

  // inventory
  getInventory() { return this.get('inventory'); },
  setInventory(v) { this.set('inventory', v); },
  getInventoryItem(branchId, formTypeId) {
    return this.getInventory().find(i => i.branch_id === branchId && i.form_type_id === formTypeId);
  },
  upsertInventory(branchId, formTypeId, delta) {
    const inv = this.getInventory();
    const idx = inv.findIndex(i => i.branch_id === branchId && i.form_type_id === formTypeId);
    if (idx >= 0) {
      inv[idx].quantity = Math.max(0, inv[idx].quantity + delta);
      inv[idx].last_updated = new Date().toISOString();
    } else {
      inv.push({ id: this.nextId(inv), branch_id: branchId, form_type_id: formTypeId, quantity: Math.max(0, delta), last_updated: new Date().toISOString() });
    }
    this.setInventory(inv);
  },

  // transactions
  getTransactions() { return this.get('transactions'); },
  setTransactions(v) { this.set('transactions', v); },
  addTransaction(tx) {
    const txs = this.getTransactions();
    tx.id = this.nextId(txs);
    tx.created_at = new Date().toISOString();
    txs.push(tx);
    this.setTransactions(txs);
    return tx;
  },

  // users
  getUsers() { return this.get('users'); },
  setUsers(v) { this.set('users', v); },
  findUser(username) { return this.getUsers().find(u => u.username === username); },
};

// ─────────────────────────── AUTH ────────────────────────────
const Auth = {
  currentUser: null,
  async hashPassword(pw) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  },
  async login(username, password) {
    const user = DB.findUser(username);
    if (!user) return false;
    const hash = await this.hashPassword(password);
    if (user.password !== hash) return false;
    this.currentUser = user;
    sessionStorage.setItem('inv_session', JSON.stringify(user));
    return true;
  },
  logout() {
    this.currentUser = null;
    sessionStorage.removeItem('inv_session');
  },
  loadSession() {
    const s = sessionStorage.getItem('inv_session');
    if (s) { try { this.currentUser = JSON.parse(s); return true; } catch {} }
    return false;
  },
  isAdmin() { return this.currentUser && this.currentUser.role === 'admin'; },
  branchId() { return this.currentUser ? this.currentUser.branch_id : null; },
};

// ─────────────────────────── FLASH ────────────────────────────
function flash(msg, type = 'success') {
  const c = document.getElementById('flash-container');
  const id = 'fl_' + Date.now();
  const el = document.createElement('div');
  el.id = id;
  el.className = `alert alert-${type} alert-dismissible shadow-sm py-2 px-3`;
  el.innerHTML = `${msg}<button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert"></button>`;
  c.appendChild(el);
  setTimeout(() => { const e = document.getElementById(id); if(e) e.remove(); }, 3000);
}

// ─────────────────────────── HELPERS ────────────────────────────
function fmt(n) { return Number(n).toLocaleString('ko-KR'); }
function fmtDate(iso) { if (!iso) return '-'; return iso.slice(0,16).replace('T',' '); }
function today() { return new Date().toISOString().slice(0,10); }
function currentMonth() { return new Date().toISOString().slice(0,7); }

function branchLabel(b) { return b ? `${b.code} ${b.name}` : '-'; }

function getBranch(id) { return DB.getBranches().find(b => b.id === id); }
function getFormType(id) { return DB.getFormTypes().find(f => f.id === id); }
function getUser(id) { return DB.getUsers().find(u => u.id === id); }

function getStockStatus(qty, threshold) {
  if (qty === 0) return 'empty';
  if (qty <= threshold) return 'low';
  return 'ok';
}
function statusBadge(qty, threshold) {
  const s = getStockStatus(qty, threshold);
  if (s === 'empty') return '<span class="status-empty">소진</span>';
  if (s === 'low')   return '<span class="status-low">부족</span>';
  return '<span class="status-ok">정상</span>';
}

function visibleBranches() {
  if (Auth.isAdmin()) return DB.getBranches();
  return DB.getBranches().filter(b => b.id === Auth.branchId());
}

function branchOptions(selected = null, includeAll = false) {
  const branches = visibleBranches();
  let html = includeAll ? '<option value="">전체 지점</option>' : '<option value="">지점 선택</option>';
  branches.forEach(b => {
    html += `<option value="${b.id}" ${selected == b.id ? 'selected' : ''}>${branchLabel(b)}</option>`;
  });
  return html;
}

function formTypeOptions(selected = null, includeAll = false) {
  const fts = DB.getFormTypes();
  let html = includeAll ? '<option value="">전체 양식</option>' : '<option value="">양식 선택</option>';
  fts.forEach(f => {
    html += `<option value="${f.id}" ${selected == f.id ? 'selected' : ''}>${f.name}</option>`;
  });
  return html;
}

  // ─── INVENTORY ───────────────────────────────────────────
  renderInventory(filterBranch = '', filterFt = '') {
    const branches = visibleBranches();
    const formTypes = DB.getFormTypes();
    const inventory = DB.getInventory();

    // build map: ft_id -> { branch_id -> qty }
    const ftMap = {};
    formTypes.forEach(ft => ftMap[ft.id] = {});
    inventory.forEach(inv => {
      if (!ftMap[inv.form_type_id]) return;
      const br = getBranch(inv.branch_id);
      if (!br) return;
      if (!Auth.isAdmin() && inv.branch_id !== Auth.branchId()) return;
      ftMap[inv.form_type_id][inv.branch_id] = inv.quantity;
    });

    const visibleFts = filterFt ? formTypes.filter(f => f.id == filterFt) : formTypes;
    const visibleBrs = filterBranch ? branches.filter(b => b.id == filterBranch) : branches;

    // summary rows
    let summaryRows = '';
    visibleFts.forEach(ft => {
      const bqtys = Object.values(ftMap[ft.id] || {});
      const totalQty = bqtys.reduce((a,b) => a+b, 0);
      const brCount = bqtys.filter(q => q > 0).length;
      const emptyCount = visibleBrs.filter(b => (ftMap[ft.id][b.id]||0) === 0).length;
      const lowCount = visibleBrs.filter(b => { const q = ftMap[ft.id][b.id]||0; return q > 0 && q <= ft.min_threshold; }).length;
      const totalVal = totalQty * ft.unit_price;
      summaryRows += `<tr>
        <td>${ft.name}</td><td class="text-muted small">${ft.unit_detail}</td>
        <td class="fw-bold">${fmt(totalQty)} ${ft.unit}</td>
        <td>${brCount}</td>
        <td class="text-danger">${emptyCount}</td>
        <td class="text-warning">${lowCount}</td>
        <td>₩${fmt(totalVal)}</td>
      </tr>`;
    });

    // detail rows
    let detailRows = '';
    visibleBrs.forEach(br => {
      visibleFts.forEach(ft => {
        const qty = ftMap[ft.id][br.id] || 0;
        const lastInv = inventory.find(i => i.branch_id === br.id && i.form_type_id === ft.id);
        detailRows += `<tr>
          <td>${branchLabel(br)}</td><td>${ft.name}</td>
          <td>${fmt(qty)} ${ft.unit}</td>
          <td>₩${fmt(qty * ft.unit_price)}</td>
          <td>${statusBadge(qty, ft.min_threshold)}</td>
          <td class="text-muted small">${fmtDate(lastInv?.last_updated)}</td>
        </tr>`;
      });
    });

    // CSV download
    const csvDownload = () => {
      let csv = 'BOM지점,양식명,수량,단위,재고가치,상태,최종수정\n';
      visibleBrs.forEach(br => {
        visibleFts.forEach(ft => {
          const qty = ftMap[ft.id][br.id] || 0;
          const lastInv = inventory.find(i => i.branch_id === br.id && i.form_type_id === ft.id);
          const st = getStockStatus(qty, ft.min_threshold);
          csv += `"${branchLabel(br)}","${ft.name}",${qty},${ft.unit},${qty*ft.unit_price},${st==='ok'?'정상':st==='low'?'부족':'소진'},${fmtDate(lastInv?.last_updated)}\n`;
        });
      });
      const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `inventory_${today()}.csv`;
      a.click();
    };

    this.pc().innerHTML = `

        <tbody>${summaryRows || '<tr><td colspan="7" class="text-center text-muted py-3">데이터 없음</td></tr>'}</tbody>

      </table>
    </div>
  </div>
</div>`;

    document.getElementById('filterBtn').addEventListener('click', () => {

    <div class="mb-3">
      <label class="form-label fw-semibold">양식 종류 <span class="text-danger">*</span></label>
      <select id="tr_ft" class="form-select">${formTypeOptions()}</select>
    </div>
    <div id="tr_stock_info" class="mb-2 small text-muted"></div>
    <div class="mb-3">
      <label class="form-label fw-semibold">수량 <span class="text-danger">*</span></label>
      <input type="number" id="tr_qty" class="form-control" min="1" placeholder="수량 입력">
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">비고</label>
      <input type="text" id="tr_notes" class="form-control" placeholder="비고 (선택)">
    </div>
    <div class="d-flex gap-2">
      <button id="trSubmit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>이전 처리</button>
      <a href="#dashboard" class="btn btn-outline-secondary">취소</a>
    </div>
  </div>
</div>`;

    const updateInfo = () => {
      const fromId = parseInt(document.getElementById('tr_from').value);
      const ftId   = parseInt(document.getElementById('tr_ft').value);
      const el = document.getElementById('tr_stock_info');
      if (fromId && ftId) {
        const inv = DB.getInventoryItem(fromId, ftId);
        const ft = getFormType(ftId);
        el.innerHTML = `출발지 재고: <strong>${fmt(inv?.quantity||0)} ${ft?.unit||''}</strong>`;
      } else el.innerHTML = '';
    };
    document.getElementById('tr_from').addEventListener('change', updateInfo);
    document.getElementById('tr_ft').addEventListener('change', updateInfo);

    document.getElementById('trSubmit').addEventListener('click', () => {
      const fromId = parseInt(document.getElementById('tr_from').value);
      const toId   = parseInt(document.getElementById('tr_to').value);
      const ftId   = parseInt(document.getElementById('tr_ft').value);
      const qty    = parseInt(document.getElementById('tr_qty').value);
      const notes  = document.getElementById('tr_notes').value.trim();
      if (!fromId) { flash('출발 지점을 선택하세요.','warning'); return; }
      if (!toId)   { flash('도착 지점을 선택하세요.','warning'); return; }
      if (fromId === toId) { flash('출발지와 도착지가 같습니다.','warning'); return; }
      if (!ftId)   { flash('양식을 선택하세요.','warning'); return; }
      if (!qty || qty < 1) { flash('수량을 올바르게 입력하세요.','warning'); return; }
      const inv = DB.getInventoryItem(fromId, ftId);
      if (!inv || inv.quantity < qty) { flash('출발 지점의 재고가 부족합니다.','danger'); return; }

      DB.upsertInventory(fromId, ftId, -qty);
      DB.upsertInventory(toId, ftId, qty);
      DB.addTransaction({ type:'TRANSFER', form_type_id:ftId, from_branch_id:fromId, to_branch_id:toId, quantity:qty, notes, created_by:Auth.currentUser.id, period_month:currentMonth() });
      flash(`이전 완료: ${getFormType(ftId)?.name} ${fmt(qty)}개 → ${branchLabel(getBranch(toId))}`,'success');
      this.renderTransfer();
    });
  },

  // ─── TRANSACTIONS ─────────────────────────────────────────
  renderTransactions(filters = {}) {
    const { fBranch='', fFt='', fType='', fFrom='', fTo='' } = filters;
    let txs = DB.getTransactions();
    if (!Auth.isAdmin()) {
      const bid = Auth.branchId();
      txs = txs.filter(t => t.from_branch_id === bid || t.to_branch_id === bid);
    }
    if (fBranch) txs = txs.filter(t => t.from_branch_id == fBranch || t.to_branch_id == fBranch);
    if (fFt)     txs = txs.filter(t => t.form_type_id == fFt);
    if (fType)   txs = txs.filter(t => t.type === fType);
    if (fFrom)   txs = txs.filter(t => t.created_at >= fFrom);
    if (fTo)     txs = txs.filter(t => t.created_at <= fTo + 'T23:59:59');
    txs = txs.sort((a,b) => b.id - a.id).slice(0, 300);

    const typeBadgeHtml = (type) => {
      if (type === 'IN')       return '<span class="badge badge-in">입고</span>';
      if (type === 'OUT')      return '<span class="badge badge-out">출고</span>';
      if (type === 'TRANSFER') return '<span class="badge badge-transfer">이전</span>';
      return type;
    };

    this.pc().innerHTML = `
<h4 class="fw-bold mb-3"><i class="bi bi-list-ul me-2 text-primary"></i>입출고 내역</h4>
<div class="card shadow-sm mb-3">
  <div class="card-body py-2">
    <div class="row g-2">
      <div class="col-md-3"><select id="f_branch" class="form-select form-select-sm">${branchOptions(fBranch, true)}</select></div>
      <div class="col-md-3"><select id="f_ft" class="form-select form-select-sm">${formTypeOptions(fFt, true)}</select></div>
      <div class="col-md-2">
        <select id="f_type" class="form-select form-select-sm">
          <option value="" ${!fType?'selected':''}>전체 유형</option>
          <option value="IN" ${fType==='IN'?'selected':''}>입고</option>
          <option value="OUT" ${fType==='OUT'?'selected':''}>출고</option>
          <option value="TRANSFER" ${fType==='TRANSFER'?'selected':''}>이전</option>
        </select>
      </div>
      <div class="col-md-2"><input type="date" id="f_from" class="form-control form-control-sm" value="${fFrom}" placeholder="시작일"></div>
      <div class="col-md-2"><input type="date" id="f_to" class="form-control form-control-sm" value="${fTo}" placeholder="종료일"></div>
    </div>
    <div class="mt-2">
      <button id="txFilterBtn" class="btn btn-primary btn-sm me-2">조회</button>
      <button id="txResetBtn" class="btn btn-outline-secondary btn-sm">초기화</button>
      <span class="ms-2 text-muted small">총 ${txs.length}건 (최대 300건)</span>
    </div>
  </div>
</div>
<div class="card shadow-sm">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-sm table-hover mb-0">
        <thead class="table-light">
          <tr><th>#</th><th>유형</th><th>출발지</th><th>도착지</th><th>양식명</th><th>수량</th><th>기간</th><th>비고</th><th>일시</th></tr>
        </thead>
        <tbody>
          ${txs.length === 0 ? '<tr><td colspan="9" class="text-center text-muted py-3">내역 없음</td></tr>' :
            txs.map(tx => {
              const ft = getFormType(tx.form_type_id);
              const frBr = getBranch(tx.from_branch_id);
              const toBr = getBranch(tx.to_branch_id);
              return `<tr>
                <td class="text-muted">${tx.id}</td>
                <td>${typeBadgeHtml(tx.type)}</td>
                <td>${frBr ? branchLabel(frBr) : '-'}</td>
                <td>${toBr ? branchLabel(toBr) : '-'}</td>
                <td>${ft?.name||'-'}</td>
                <td>${fmt(tx.quantity)}</td>
                <td class="text-muted small">${tx.period_month||'-'}</td>
                <td class="text-muted small">${tx.notes||''}</td>
                <td class="text-muted small">${fmtDate(tx.created_at)}</td>
              </tr>`;
            }).join('')}
        </tbody>
      </table>
    </div>
  </div>
</div>`;

    document.getElementById('txFilterBtn').addEventListener('click', () => {
      this.renderTransactions({
        fBranch: document.getElementById('f_branch').value,
        fFt:     document.getElementById('f_ft').value,
        fType:   document.getElementById('f_type').value,
        fFrom:   document.getElementById('f_from').value,
        fTo:     document.getElementById('f_to').value,
      });
    });
    document.getElementById('txResetBtn').addEventListener('click', () => this.renderTransactions());
  },

  // ─── REPORT ──────────────────────────────────────────────
  renderReport() {
    this.destroyChart('monthly');
    this.destroyChart('status');
    this.destroyChart('topOut');

    const branches  = visibleBranches();
    const formTypes = DB.getFormTypes();
    const inventory = DB.getInventory();
    const transactions = DB.getTransactions();

    // Branch summary
    const branchSummary = branches.map(br => {
      const brInv = inventory.filter(i => i.branch_id === br.id);
      let ok=0, low=0, empty=0, totalVal=0;
      formTypes.forEach(ft => {
        const inv = brInv.find(i => i.form_type_id === ft.id);
        const qty = inv?.quantity || 0;
        totalVal += qty * ft.unit_price;
        const st = getStockStatus(qty, ft.min_threshold);
        if (st==='ok') ok++; else if (st==='low') low++; else empty++;
      });
      return { br, ok, low, empty, totalVal };
    });

    // Monthly IN/OUT/TRANSFER for last 6 months
    const months = [];
    for (let i=5; i>=0; i--) {
      const d = new Date(); d.setMonth(d.getMonth()-i);
      months.push(d.toISOString().slice(0,7));
    }
    const monthIn = months.map(m => transactions.filter(t => t.type==='IN' && t.period_month===m).reduce((s,t)=>s+t.quantity,0));
    const monthOut= months.map(m => transactions.filter(t => t.type==='OUT'&& t.period_month===m).reduce((s,t)=>s+t.quantity,0));
    const monthTr = months.map(m => transactions.filter(t => t.type==='TRANSFER'&&t.period_month===m).reduce((s,t)=>s+t.quantity,0));

    // Stock status counts
    let totalOk=0, totalLow=0, totalEmpty=0;
    const visibleInv = Auth.isAdmin() ? inventory : inventory.filter(i => i.branch_id === Auth.branchId());
    visibleInv.forEach(i => {
      const ft = getFormType(i.form_type_id);
      if (!ft) return;
      const st = getStockStatus(i.quantity, ft.min_threshold);
      if (st==='ok') totalOk++; else if (st==='low') totalLow++; else totalEmpty++;
    });

    // Top 10 form types by outbound last 30 days
    const d30 = new Date(); d30.setDate(d30.getDate()-30);
    const d30Str = d30.toISOString();
    const ftOutMap = {};
    transactions.filter(t => t.type==='OUT' && t.created_at >= d30Str).forEach(t => {
      ftOutMap[t.form_type_id] = (ftOutMap[t.form_type_id]||0) + t.quantity;
    });
    const topFts = Object.entries(ftOutMap).sort((a,b)=>b[1]-a[1]).slice(0,10);

    this.pc().innerHTML = `
<h4 class="fw-bold mb-3"><i class="bi bi-bar-chart-fill me-2 text-primary"></i>리 포 트</h4>

<div class="card shadow-sm mb-3">
  <div class="card-header bg-white py-2 fw-semibold">지점별 재고 현황 요약</div>
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-sm table-hover mb-0">
        <thead class="table-light"><tr><th>지점</th><th>유형</th><th class="text-success">정상</th><th class="text-warning">부족</th><th class="text-danger">소진</th><th>총 재고가치</th></tr></thead>
        <tbody>
          ${branchSummary.map(({br,ok,low,empty,totalVal}) => `
            <tr>
              <td>${branchLabel(br)}</td><td><span class="badge bg-secondary">${br.type}</span></td>
              <td class="text-success">${ok}</td><td class="text-warning">${low}</td><td class="text-danger">${empty}</td>
              <td>₩${fmt(totalVal)}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="row g-3 mb-3">
  <div class="col-lg-8">
    <div class="card shadow-sm h-100">
      <div class="card-header bg-white py-2 fw-semibold">월별 입출고 현황 (최근 6개월)</div>
      <div class="card-body"><div class="chart-container"><canvas id="chartMonthly"></canvas></div></div>
    </div>
  </div>
  <div class="col-lg-4">
    <div class="card shadow-sm h-100">
      <div class="card-header bg-white py-2 fw-semibold">재고 상태 분포</div>
      <div class="card-body"><div class="chart-container"><canvas id="chartStatus"></canvas></div></div>
    </div>
  </div>
</div>

<div class="card shadow-sm">
  <div class="card-header bg-white py-2 fw-semibold">최다 출고 양식 TOP 10 (최근 30일)</div>
  <div class="card-body"><div class="chart-container"><canvas id="chartTopOut"></canvas></div></div>
</div>`;

    // Monthly chart
    this.charts['monthly'] = new Chart(document.getElementById('chartMonthly'), {
      type: 'bar',
      data: {
        labels: months,
        datasets: [
          { label:'입고', data:monthIn, backgroundColor:'rgba(25,135,84,0.7)' },
          { label:'출고', data:monthOut, backgroundColor:'rgba(220,53,69,0.7)' },
          { label:'이전', data:monthTr, backgroundColor:'rgba(13,110,253,0.7)' },
        ]
      },
      options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'top'}} }
    });

    // Status doughnut
    this.charts['status'] = new Chart(document.getElementById('chartStatus'), {
      type: 'doughnut',
      data: {
        labels: ['정상','부족','소진'],
        datasets: [{ data:[totalOk,totalLow,totalEmpty], backgroundColor:['#198754','#fd7e14','#dc3545'] }]
      },
      options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}} }
    });

    // Top outbound
    const topLabels = topFts.map(([id]) => getFormType(parseInt(id))?.name || id);
    const topData   = topFts.map(([,qty]) => qty);
    this.charts['topOut'] = new Chart(document.getElementById('chartTopOut'), {
      type: 'bar',
      data: {
        labels: topLabels,
        datasets: [{ label:'출고 수량', data:topData, backgroundColor:'rgba(220,53,69,0.7)' }]
      },
      options: {
        responsive:true, maintainAspectRatio:false, indexAxis:'y',
        plugins:{legend:{display:false}}
      }
    });
  },

  // ─── USERS ───────────────────────────────────────────────
  renderUsers() {
    const users = DB.getUsers();
    const branches = DB.getBranches();

    const renderTable = () => users.map(u => {
      const br = u.branch_id ? getBranch(u.branch_id) : null;
      return `<tr>
        <td>${u.id}</td><td><strong>${u.username}</strong></td>
        <td><span class="badge ${u.role==='admin'?'bg-danger':'bg-primary'}">${u.role==='admin'?'관리자':'스태프'}</span></td>
        <td>${br ? branchLabel(br) : '본부'}</td>
        <td>
          <button class="btn btn-sm btn-outline-warning me-1" onclick="App.showResetPw(${u.id})">비밀번호 재설정</button>
          ${u.id !== Auth.currentUser.id ? `<button class="btn btn-sm btn-outline-danger" onclick="App.deleteUser(${u.id})">삭제</button>` : ''}
        </td>
      </tr>`;
    }).join('');

    const branchOptsAll = () => {
      let h = '<option value="">본부 (없음)</option>';
      branches.forEach(b => h += `<option value="${b.id}">${branchLabel(b)}</option>`);
      return h;
    };

    this.pc().innerHTML = `
<h4 class="fw-bold mb-3"><i class="bi bi-people-fill me-2 text-primary"></i>사용자 관리</h4>
<div class="row g-3">
  <div class="col-lg-8">
    <div class="card shadow-sm">
      <div class="card-header bg-white py-2 fw-semibold">사용자 목록</div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-sm table-hover mb-0" id="usersTable">
            <thead class="table-light"><tr><th>#</th><th>사용자명</th><th>역할</th><th>지점</th><th>작업</th></tr></thead>
            <tbody>${renderTable()}</tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <div class="col-lg-4">
    <div class="card shadow-sm mb-3">
      <div class="card-header bg-white py-2 fw-semibold">신규 사용자 등록</div>
      <div class="card-body">
        <div class="mb-2">
          <label class="form-label fw-semibold small">사용자명</label>
          <input type="text" id="new_un" class="form-control form-control-sm" placeholder="username">
        </div>
        <div class="mb-2">
          <label class="form-label fw-semibold small">비밀번호</label>
          <input type="password" id="new_pw" class="form-control form-control-sm" placeholder="password">
        </div>
        <div class="mb-2">
          <label class="form-label fw-semibold small">역할</label>
          <select id="new_role" class="form-select form-select-sm">
            <option value="staff">스태프</option>
            <option value="admin">관리자</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold small">지점</label>
          <select id="new_branch" class="form-select form-select-sm">${branchOptsAll()}</select>
        </div>
        <button id="createUserBtn" class="btn btn-success btn-sm w-100">사용자 생성</button>
      </div>
    </div>
    <div id="resetPwPanel" class="card shadow-sm d-none">
      <div class="card-header bg-white py-2 fw-semibold">비밀번호 재설정</div>
      <div class="card-body">
        <p id="resetPwLabel" class="small text-muted mb-2"></p>
        <input type="password" id="reset_pw" class="form-control form-control-sm mb-2" placeholder="새 비밀번호">
        <div class="d-flex gap-2">
          <button id="confirmResetBtn" class="btn btn-warning btn-sm">확인</button>
          <button id="cancelResetBtn" class="btn btn-outline-secondary btn-sm">취소</button>
        </div>
      </div>
    </div>
  </div>
</div>`;

    document.getElementById('createUserBtn').addEventListener('click', async () => {
      const un    = document.getElementById('new_un').value.trim();
      const pw    = document.getElementById('new_pw').value;
      const role  = document.getElementById('new_role').value;
      const brId  = parseInt(document.getElementById('new_branch').value) || null;
      if (!un)    { flash('사용자명을 입력하세요.','warning'); return; }
      if (!pw)    { flash('비밀번호를 입력하세요.','warning'); return; }
      if (DB.findUser(un)) { flash('이미 존재하는 사용자명입니다.','warning'); return; }
      const hash = await Auth.hashPassword(pw);
      const users2 = DB.getUsers();
      users2.push({ id: DB.nextId(users2), username:un, password:hash, branch_id:brId, role });
      DB.setUsers(users2);
      flash('사용자가 생성되었습니다.','success');
      this.renderUsers();
    });
  },

  showResetPw(userId) {
    const user = DB.getUsers().find(u => u.id === userId);
    if (!user) return;
    const panel = document.getElementById('resetPwPanel');
    panel.classList.remove('d-none');
    document.getElementById('resetPwLabel').textContent = `대상: ${user.username}`;
    document.getElementById('reset_pw').value = '';
    document.getElementById('confirmResetBtn').onclick = async () => {
      const pw = document.getElementById('reset_pw').value;
      if (!pw) { flash('새 비밀번호를 입력하세요.','warning'); return; }
      const hash = await Auth.hashPassword(pw);
      const users = DB.getUsers();
      const idx = users.findIndex(u => u.id === userId);
      if (idx>=0) { users[idx].password = hash; DB.setUsers(users); }
      flash('비밀번호가 재설정되었습니다.','success');
      panel.classList.add('d-none');
    };
    document.getElementById('cancelResetBtn').onclick = () => panel.classList.add('d-none');
  },

  deleteUser(userId) {
    if (!confirm('정말 삭제하시겠습니까?')) return;
    const users = DB.getUsers().filter(u => u.id !== userId);
    DB.setUsers(users);
    flash('사용자가 삭제되었습니다.','success');
    this.renderUsers();
  },
};

// ─────────────────────────── BOOT ────────────────────────────
(async () => {
  await seedData();
  Auth.loadSession();

  window.addEventListener('hashchange', () => App.render());
  App.render();
})();
</script>
</body>
</html>
