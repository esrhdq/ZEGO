{% extends 'base.html' %}
{% block title %}비밀번호 변경{% endblock %}
{% block title_icon %}<i class="fa-solid fa-key"></i>{% endblock %}
{% block page_title %}비밀번호 변경{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-header bg-white py-3">
        <strong>내 비밀번호 변경</strong>
        <small class="text-muted ms-2">{{ session.username }}</small>
      </div>
      <div class="card-body p-4">
        <form method="post" id="pwForm">
          <div class="mb-3">
            <label class="form-label fw-semibold">현재 비밀번호 <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
              <input type="password" name="current_password" id="curPw"
                     class="form-control" required placeholder="현재 비밀번호">
              <button type="button" class="btn btn-outline-secondary toggle-pw" data-target="curPw">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>

          <hr class="my-3">

          <div class="mb-3">
            <label class="form-label fw-semibold">새 비밀번호 <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
              <input type="password" name="new_password" id="newPw"
                     class="form-control" required minlength="6" placeholder="6자 이상"
                     oninput="checkMatch()">
              <button type="button" class="btn btn-outline-secondary toggle-pw" data-target="newPw">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <!-- 강도 바 -->
            <div class="mt-2">
              <div class="progress" style="height:4px">
                <div id="strengthBar" class="progress-bar" style="width:0%;transition:.3s"></div>
              </div>
              <small id="strengthLabel" class="text-muted"></small>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">새 비밀번호 확인 <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
              <input type="password" name="confirm_password" id="confPw"
                     class="form-control" required placeholder="동일하게 입력"
                     oninput="checkMatch()">
              <button type="button" class="btn btn-outline-secondary toggle-pw" data-target="confPw">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <div id="matchMsg" class="small mt-1 d-none"></div>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" id="submitBtn" class="btn btn-primary px-4">
              <i class="fa-solid fa-check me-1"></i>변경
            </button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">취소</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// 비밀번호 표시/숨기기
document.querySelectorAll('.toggle-pw').forEach(btn => {
  btn.addEventListener('click', () => {
    const input = document.getElementById(btn.dataset.target);
    const icon  = btn.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.className = 'fa-solid fa-eye-slash';
    } else {
      input.type = 'password';
      icon.className = 'fa-solid fa-eye';
    }
  });
});

// 비밀번호 강도
document.getElementById('newPw').addEventListener('input', function() {
  const v = this.value;
  const bar   = document.getElementById('strengthBar');
  const label = document.getElementById('strengthLabel');
  let score = 0;
  if (v.length >= 6)  score++;
  if (v.length >= 10) score++;
  if (/[A-Z]/.test(v)) score++;
  if (/[0-9]/.test(v)) score++;
  if (/[^a-zA-Z0-9]/.test(v)) score++;

  const levels = [
    {w:'20%', cls:'bg-danger',  txt:'매우 약함'},
    {w:'40%', cls:'bg-warning', txt:'약함'},
    {w:'60%', cls:'bg-info',    txt:'보통'},
    {w:'80%', cls:'bg-primary', txt:'강함'},
    {w:'100%',cls:'bg-success', txt:'매우 강함'},
  ];
  const lv = levels[Math.min(score, 4)];
  bar.style.width = lv.w;
  bar.className   = 'progress-bar ' + lv.cls;
  label.textContent = v.length ? lv.txt : '';
});

// 일치 확인
function checkMatch() {
  const nv = document.getElementById('newPw').value;
  const cv = document.getElementById('confPw').value;
  const msg = document.getElementById('matchMsg');
  const btn = document.getElementById('submitBtn');

  if (!cv) { msg.classList.add('d-none'); btn.disabled = false; return; }

  msg.classList.remove('d-none');
  if (nv === cv) {
    msg.innerHTML = '<span class="text-success"><i class="fa-regular fa-circle-check me-1"></i>비밀번호가 일치합니다.</span>';
    btn.disabled = false;
  } else {
    msg.innerHTML = '<span class="text-danger"><i class="fa-regular fa-circle-xmark me-1"></i>비밀번호가 일치하지 않습니다.</span>';
    btn.disabled = true;
  }
}

// 제출 전 최종 확인
document.getElementById('pwForm').addEventListener('submit', function(e) {
  const nv = document.getElementById('newPw').value;
  const cv = document.getElementById('confPw').value;
  if (nv !== cv) { e.preventDefault(); checkMatch(); }
});
</script>
{% endblock %}
