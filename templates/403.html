<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>접근 불가</title>
  <style>
    body { font-family: 'Pretendard', sans-serif; display: flex; align-items: center;
           justify-content: center; min-height: 100vh; margin: 0; background: #f1f5f9; }
    .box { text-align: center; background: #fff; padding: 48px 64px; border-radius: 16px;
           box-shadow: 0 4px 24px rgba(0,0,0,.08); }
    h1 { font-size: 4rem; color: #ef4444; margin: 0 0 8px; }
    p  { color: #64748b; font-size: 1rem; margin: 0; }
  </style>
</head>
<body>
  <div class="box">
    <h1>403</h1>
    <p>접근이 허용되지 않은 IP입니다.</p>
    <p style="margin-top:8px;font-size:.85rem;color:#94a3b8">허가된 네트워크에서 접속하세요.</p>
  </div>
</body>
</html>
