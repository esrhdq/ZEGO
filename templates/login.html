<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 — 운송본부 양식 재고관리</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #1a2340; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { width: 380px; border-radius: 16px; border: none; box-shadow: 0 8px 32px rgba(0,0,0,.3); }
    .login-header { background: linear-gradient(135deg,#2563eb,#7c3aed); border-radius: 16px 16px 0 0; padding: 32px; text-align: center; color: #fff; }
    .login-header .icon { font-size: 2.5rem; }
    .login-header h4 { margin: 8px 0 4px; font-weight: 700; }
    .login-header small { opacity: .8; }
    .login-body { padding: 28px; }
    .form-control:focus { border-color: #2563eb; box-shadow: 0 0 0 .2rem rgba(37,99,235,.2); }
    .btn-login { background: linear-gradient(135deg,#2563eb,#7c3aed); border: none; }
    .hint { background: #f0f4ff; border-radius: 8px; padding: 10px 14px; font-size: .82rem; color: #475569; }
  </style>
</head>
<body>
<div class="card login-card">
  <div class="login-header">
    <div class="icon"><i class="bi bi-airplane-fill"></i></div>
    <h4>운송본부 양식 재고관리</h4>
    <small>항공사 운송양식 재고관리 시스템</small>
  </div>
  <div class="login-body">
    {% set messages = get_flashed_messages() %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
    {% endfor %}
    <form method="post">
      <div class="mb-3">
        <label class="form-label fw-semibold">아이디</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control" placeholder="아이디 입력" required autofocus>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">비밀번호</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" placeholder="비밀번호 입력" required>
        </div>
      </div>
      <button type="submit" class="btn btn-login btn-primary w-100 py-2 fw-semibold">
        <i class="bi bi-box-arrow-in-right me-2"></i>로그인
      </button>
    </form>
    <div class="hint mt-3">
      <strong>테스트 계정</strong><br>
      관리자: <code>admin</code> / <code>admin1234</code><br>
      김포지점: <code>gmp</code> / <code>staff1234</code><br>
      인천지점: <code>icn</code> / <code>staff1234</code>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
