<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design D — 에디토리얼 클린 (Editorial Clean)</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  * { font-family: 'Pretendard', -apple-system, sans-serif; box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* 왼쪽 얇은 강조선 */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 4px;
    height: 100vh;
    background: #CC1625;
    pointer-events: none;
  }

  /* 우측 상단 장식 */
  body::after {
    content: '';
    position: fixed;
    top: 0; right: 0;
    width: 240px; height: 3px;
    background: linear-gradient(90deg, transparent, #CC1625);
    pointer-events: none;
  }

  .page-wrap {
    width: 100%;
    max-width: 1100px;
    padding: 40px;
    display: grid;
    grid-template-columns: 1fr 1px 400px;
    gap: 0;
    align-items: center;
    min-height: 100vh;
  }

  /* 왼쪽 — 브랜드 */
  .brand-side {
    padding-right: 60px;
  }

  .brand-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: .72rem;
    font-weight: 700;
    color: #CC1625;
    letter-spacing: .12em;
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .brand-eyebrow-line {
    width: 24px; height: 2px;
    background: #CC1625;
  }

  .brand-title {
    font-size: 3.2rem;
    font-weight: 900;
    color: #09090B;
    line-height: 1.08;
    letter-spacing: -.04em;
    margin-bottom: 20px;
  }
  .brand-title .accent { color: #CC1625; }
  .brand-title .light { color: #A1A1AA; }

  .brand-desc {
    font-size: .92rem;
    color: #71717A;
    line-height: 1.75;
    margin-bottom: 36px;
    max-width: 400px;
    font-weight: 500;
  }

  .brand-features {
    display: flex; flex-direction: column; gap: 12px;
    margin-bottom: 40px;
  }
  .feature-item {
    display: flex; align-items: center; gap: 12px;
    font-size: .84rem; font-weight: 600; color: #3F3F46;
  }
  .feature-icon {
    width: 32px; height: 32px;
    background: #FFF1F2;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: #CC1625; font-size: .78rem;
    flex-shrink: 0;
  }

  .brand-stats {
    display: flex; gap: 0;
    border: 1px solid #E4E4E7;
    border-radius: 12px;
    overflow: hidden;
  }
  .brand-stat {
    flex: 1;
    padding: 16px 20px;
    border-right: 1px solid #E4E4E7;
  }
  .brand-stat:last-child { border-right: none; }
  .brand-stat .num {
    font-size: 1.5rem; font-weight: 900;
    color: #09090B; line-height: 1;
  }
  .brand-stat .lbl {
    font-size: .72rem; color: #A1A1AA;
    font-weight: 600; margin-top: 3px;
  }

  /* 구분선 */
  .divider-v {
    width: 1px;
    background: #E4E4E7;
    height: 100%;
    min-height: 400px;
    align-self: center;
  }

  /* 오른쪽 — 로그인 */
  .login-side {
    padding-left: 60px;
  }

  .login-label {
    font-size: .68rem;
    font-weight: 700;
    color: #A1A1AA;
    letter-spacing: .12em;
    text-transform: uppercase;
    margin-bottom: 24px;
    display: flex; align-items: center; gap: 8px;
  }
  .login-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #E4E4E7;
  }

  .form-label-e {
    font-size: .74rem;
    font-weight: 700;
    color: #3F3F46;
    margin-bottom: 6px;
    display: block;
    letter-spacing: .02em;
  }
  .form-control-e {
    width: 100%;
    border: 1px solid #E4E4E7;
    border-bottom: 2px solid #E4E4E7;
    border-radius: 0;
    padding: 10px 0;
    font-size: .92rem;
    color: #09090B;
    background: transparent;
    font-family: 'Pretendard', sans-serif;
    outline: none;
    transition: border-color .15s;
  }
  .form-control-e:focus {
    border-bottom-color: #CC1625;
  }
  .form-control-e::placeholder { color: #D4D4D8; }

  .mb-e { margin-bottom: 24px; }
  .mb-e-lg { margin-bottom: 32px; }

  .btn-login-e {
    width: 100%;
    background: #09090B;
    color: #fff;
    border: none;
    border-radius: 0;
    padding: 14px;
    font-size: .88rem;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s;
    letter-spacing: .04em;
    text-transform: uppercase;
    font-family: 'Pretendard', sans-serif;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .btn-login-e:hover { background: #CC1625; }

  .login-hint {
    margin-top: 20px;
    font-size: .76rem;
    color: #A1A1AA;
    font-weight: 500;
  }

  /* 사이드바 미리보기 */
  .layout-preview-e {
    display: flex;
    gap: 0;
    border: 1px solid #E4E4E7;
    border-radius: 0;
    overflow: hidden;
    margin-top: 32px;
    height: 200px;
  }
  .sb-e {
    width: 170px;
    background: #fff;
    border-right: 1px solid #E4E4E7;
    padding: 12px 0;
    flex-shrink: 0;
    position: relative;
  }
  .sb-e::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: #CC1625;
  }
  .sb-e-brand {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 12px 12px 16px;
    border-bottom: 1px solid #E4E4E7;
    margin-bottom: 8px;
  }
  .sb-e-name { font-size: .78rem; font-weight: 900; color: #09090B; letter-spacing: .08em; }
  .sb-e-dot {
    width: 6px; height: 6px;
    background: #CC1625;
    border-radius: 50%;
  }
  .sb-e-label {
    font-size: .56rem; font-weight: 700; color: #A1A1AA;
    letter-spacing: .1em; text-transform: uppercase;
    padding: 8px 16px 3px;
  }
  .sb-e-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px 7px 16px;
    font-size: .72rem; font-weight: 500;
    color: #71717A;
    cursor: pointer;
  }
  .sb-e-item i { width: 12px; text-align: center; font-size: .68rem; }
  .sb-e-item.active {
    color: #CC1625; font-weight: 700;
    background: #FFF1F2;
    border-right: 2px solid #CC1625;
  }

  .main-e {
    flex: 1;
    padding: 12px 14px;
    background: #FAFAFA;
    overflow: hidden;
  }
  .me-header {
    font-size: .7rem; font-weight: 900; color: #09090B;
    letter-spacing: .06em; text-transform: uppercase;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid #E4E4E7;
    display: flex; align-items: center; gap: 6px;
  }
  .me-header::before {
    content: '';
    width: 3px; height: 12px;
    background: #CC1625;
    border-radius: 2px;
  }
  .me-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
  .me-card {
    background: #fff;
    border: 1px solid #E4E4E7;
    padding: 8px 10px;
  }
  .me-card .num { font-size: 1rem; font-weight: 900; color: #09090B; }
  .me-card .lbl { font-size: .58rem; color: #A1A1AA; }
  .me-table { background: #fff; border: 1px solid #E4E4E7; overflow: hidden; }
  .me-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px;
    font-size: .64rem;
    border-bottom: 1px solid #F4F4F5;
    color: #3F3F46;
  }
  .me-row:last-child { border-bottom: none; }
  .me-badge {
    font-size: .58rem; padding: 1px 6px;
    font-weight: 700; letter-spacing: .04em;
  }
  .me-badge-in  { background: #F0FDF4; color: #15803D; }
  .me-badge-out { background: #FEF2F2; color: #B91C1C; }

  /* 반응형 */
  @media (max-width: 900px) {
    .page-wrap {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto auto;
      padding: 24px;
      gap: 32px;
    }
    .divider-v { display: none; }
    .brand-side { padding-right: 0; }
    .login-side { padding-left: 0; }
    .brand-title { font-size: 2.2rem; }
  }
</style>
</head>
<body>
<div class="page-wrap">
  <!-- 브랜드 사이드 -->
  <div class="brand-side">
    <div class="brand-eyebrow">
      <div class="brand-eyebrow-line"></div>
      이스타항공 재고관리
    </div>
    <div class="brand-title">
      ZEGO<br>
      <span class="light">재고를</span><br>
      <span class="accent">제어하다.</span>
    </div>
    <div class="brand-desc">
      전 지점의 기내 용품 재고를 실시간으로 추적하고,
      입·출고·이전을 단 몇 번의 클릭으로 처리하세요.
    </div>
    <div class="brand-features">
      <div class="feature-item">
        <div class="feature-icon"><i class="fa-solid fa-chart-line"></i></div>
        실시간 재고 현황 및 트렌드 차트
      </div>
      <div class="feature-item">
        <div class="feature-icon"><i class="fa-solid fa-file-excel"></i></div>
        엑셀 일괄 업로드 / 다운로드
      </div>
      <div class="feature-item">
        <div class="feature-icon"><i class="fa-solid fa-bell"></i></div>
        재고 부족 즉시 알림
      </div>
    </div>
    <div class="brand-stats">
      <div class="brand-stat">
        <div class="num">24</div>
        <div class="lbl">운영 지점</div>
      </div>
      <div class="brand-stat">
        <div class="num">100+</div>
        <div class="lbl">양식 종류</div>
      </div>
      <div class="brand-stat">
        <div class="num">99%</div>
        <div class="lbl">정확도</div>
      </div>
    </div>
  </div>

  <!-- 구분선 -->
  <div class="divider-v"></div>

  <!-- 로그인 사이드 -->
  <div class="login-side">
    <div class="login-label">시스템 로그인</div>

    <div class="mb-e">
      <label class="form-label-e">아이디</label>
      <input type="text" class="form-control-e" placeholder="아이디를 입력하세요" value="admin">
    </div>
    <div class="mb-e-lg">
      <label class="form-label-e">비밀번호</label>
      <input type="password" class="form-control-e" placeholder="비밀번호를 입력하세요" value="••••••••">
    </div>
    <button class="btn-login-e">
      <i class="fa-solid fa-arrow-right-to-bracket"></i>
      로그인
    </button>
    <div class="login-hint">계정 문의는 시스템 관리자에게 연락하세요.</div>

    <!-- 레이아웃 미리보기 -->
    <div class="layout-preview-e">
      <div class="sb-e">
        <div class="sb-e-brand">
          <div class="sb-e-dot"></div>
          <div class="sb-e-name">ZEGO</div>
        </div>
        <div class="sb-e-label">메인</div>
        <div class="sb-e-item active"><i class="fa-solid fa-gauge"></i> 대시보드</div>
        <div class="sb-e-item"><i class="fa-solid fa-boxes-stacked"></i> 재고 현황</div>
        <div class="sb-e-label">거래</div>
        <div class="sb-e-item"><i class="fa-solid fa-truck-ramp-box"></i> 입고</div>
        <div class="sb-e-item"><i class="fa-solid fa-dolly"></i> 출고</div>
      </div>
      <div class="main-e">
        <div class="me-header">대시보드</div>
        <div class="me-grid">
          <div class="me-card"><div class="num" style="color:#CC1625">3</div><div class="lbl">재고 부족</div></div>
          <div class="me-card"><div class="num">12</div><div class="lbl">오늘 거래</div></div>
        </div>
        <div class="me-table">
          <div class="me-row" style="color:#A1A1AA;font-weight:700;font-size:.58rem">최근 거래 이력</div>
          <div class="me-row">
            <span class="me-badge me-badge-in">IN</span>
            <span style="font-weight:600">안전벨트 연장</span>
            <span style="margin-left:auto;color:#A1A1AA">ICN</span>
          </div>
          <div class="me-row">
            <span class="me-badge me-badge-out">OUT</span>
            <span style="font-weight:600">구명조끼</span>
            <span style="margin-left:auto;color:#A1A1AA">GMP</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
